# Sample pyproject.toml configuration for py-schemax
# Add this section to your existing pyproject.toml file

[tool.schemax.validate]
# Output format: json or text
output_format = "json"

# Output level: silent, quiet, or verbose
# - silent: no output, only exit codes
# - quiet: only errors and summary (default)
# - verbose: detailed progress including successful validations
output_level = "verbose"

# Failure mode: fast, never, or after
# - fast: stop on first validation error
# - never: never exit with error code (useful for CI/CD)
# - after: validate all files then exit with error if any failed (default)
fail_mode = "after"

# Model-level required attributes
# Specify which schema-level fields must be present for validation to pass
# Available fields: name, fqn, description, version, columns, metadata, tags, depends_on, dependents
model_required_attributes = ["name", "fqn", "columns"]

# Column-level required attributes per data type
# Specify which fields are required for each column type
# This allows fine-grained control over validation requirements
[tool.schemax.validate.column_required_attributes]
string = ["name", "type", "max_length"]
integer = ["name", "type", "minimum", "maximum"]
float = ["name", "type", "precision"]
boolean = ["name", "type"]
date = ["name", "type", "format"]
datetime = ["name", "type", "format", "timezone"]
